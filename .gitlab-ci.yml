stages:
  - lint
  - test

default:
  image: python:3.12-slim
  before_script:
    - python -m pip install --upgrade pip
    - pip install -e ".[dev]"

lint:
  stage: lint
  script:
    - ruff check src tests
    - ruff format --check src tests

test:
  stage: test
  parallel:
    matrix:
      - PYVER: ["3.11", "3.12", "3.13"]
  image: python:$PYVER-slim
  script:
    - pytest -q
